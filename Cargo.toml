[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
indexmap = "=2.2.6"
hashbrown = "=0.14.5"
block-buffer = "=0.10.4"
cpufeatures = "=0.2.12"
crypto-common = "=0.1.6"
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"


[profile.release]
overflow-checks = false
lto = "fat"
codegen-units = 1
opt-level = "z"
